name: Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (for example 1.0.0)
        required: true
        default: '1.0.0'
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core release gate
        shell: pwsh
        run: ./tools/Run-Regression.ps1
      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version =
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
                throw 'Release tag must be v<major>.<minor>.<patch>.'
              }

              $env:GITHUB_REF_NAME.Substring(1)
            }
            else {
              $env:INPUT_VERSION
            }

          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Invalid stable release version.'
          }

          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build installer and manifest
        shell: pwsh
        run: |
          ./tools/Build-Release.ps1 `
            -Version '${{ steps.release.outputs.version }}' `
            -ExpectedCommit '${{ github.sha }}' `
            -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Verify release artifacts
        shell: pwsh
        run: |
          ./tools/Test-ReleaseArtifacts.ps1 `
            -Version '${{ steps.release.outputs.version }}' `
            -Commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LuKnight-release
          path: artifacts/release/*
      - name: Prepare draft GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/release/* --draft --verify-tag --title "Lu-Knight $env:GITHUB_REF_NAME" --generate-notes
